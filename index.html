<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الاستعلام عن النتيجة | Result Lookup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF3F8; --surface:#FFFFFF; --ink:#12263F; --muted:#5B6B7F; --line:#D5DEE9;
  --accent:#0E6F7A; --accent-ink:#FFFFFF; --pass:#1B7A4B; --fail:#B3261E; --neutral:#12263F;
  --focus:#F2A900;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0C1826; --surface:#142335; --ink:#E6EEF7; --muted:#94A6BB; --line:#25384F;
    --accent:#37B3C0; --accent-ink:#06222A; --pass:#4CC48A; --fail:#FF8A80; --neutral:#E6EEF7; }
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  min-height:100vh; background:var(--bg); color:var(--ink);
  font-family:'Cairo',Tahoma,'Segoe UI',Arial,sans-serif; line-height:1.6;
  display:flex; justify-content:center; padding:32px 16px;
}
main{width:100%; max-width:520px}
h1{font-size:1.9rem; font-weight:800; margin:8px 0 2px}
.sub{color:var(--muted); margin:0 0 24px; font-size:.95rem}
form{display:flex; gap:10px; flex-wrap:wrap}
label{flex-basis:100%; font-weight:600; font-size:.95rem}
input{
  flex:1 1 220px; min-width:0; font:inherit; font-size:1.15rem; letter-spacing:.06em;
  padding:12px 14px; border:2px solid var(--line); border-radius:10px;
  background:var(--surface); color:var(--ink); direction:ltr; text-align:left;
}
input:focus,button:focus-visible{outline:3px solid var(--focus); outline-offset:2px; border-color:var(--accent)}
button{
  font:inherit; font-weight:700; padding:12px 22px; border:0; border-radius:10px;
  background:var(--accent); color:var(--accent-ink); cursor:pointer;
}
button:disabled{opacity:.6; cursor:wait}
.status{min-height:1.6em; margin:14px 2px 0; color:var(--muted); font-size:.95rem}
.status.err{color:var(--fail); font-weight:600}
.slip{
  margin-top:10px; background:var(--surface); border:1px solid var(--line);
  border-radius:4px 4px 14px 14px; border-top:6px solid var(--accent); padding:22px 22px 24px;
}
.slip[hidden]{display:none}
.slip .name{font-size:1.5rem; font-weight:800; margin:0 0 4px}
.slip dl{display:grid; grid-template-columns:auto 1fr; gap:6px 16px; margin:14px 0 0; padding-top:14px; border-top:1px dashed var(--line)}
.slip dt{color:var(--muted)}
.slip dd{margin:0; font-weight:600}
.verdict{
  margin-top:20px; padding:14px 16px; border:2px solid currentColor; border-radius:10px;
  display:flex; justify-content:space-between; align-items:baseline; gap:12px; color:var(--neutral);
}
.verdict small{font-size:.9rem; font-weight:600; color:var(--muted)}
.verdict strong{font-size:1.7rem; font-weight:800}
.verdict.pass{color:var(--pass)} .verdict.fail{color:var(--fail)}
footer{margin-top:28px; font-size:.8rem; color:var(--muted)}
@media (prefers-reduced-motion:no-preference){ .slip{animation:rise .25s ease-out} @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}} }
</style>
</head>
<body>
<main>
  <h1>الاستعلام عن النتيجة</h1>
  <p class="sub">Student result lookup &mdash; أدخل رقمك الجامعي لعرض نتيجتك</p>

  <form id="f" autocomplete="off">
    <label for="sid">الرقم الجامعي / Student ID</label>
    <input id="sid" inputmode="numeric" autocomplete="off" required placeholder="20230145">
    <button id="go" type="submit">عرض النتيجة</button>
  </form>
  <div id="status" class="status" role="status" aria-live="polite"></div>

  <section id="slip" class="slip" hidden aria-live="polite">
    <p class="name" id="r-name"></p>
    <dl>
      <dt>الرقم الجامعي</dt><dd id="r-id"></dd>
      <dt>القسم / Department</dt><dd id="r-dept"></dd>
    </dl>
    <div class="verdict" id="verdict"><small>النتيجة / Result</small><strong id="r-res"></strong></div>
  </section>

  <footer>إذا لم تظهر نتيجتك تأكد من كتابة الرقم الجامعي بشكل صحيح أو تواصل مع شئون الطلاب.</footer>
</main>

<script>
const ITER = 100000;
const _enc = new TextEncoder(), _dec = new TextDecoder();
const toB64 = (buf) => { let s = ''; new Uint8Array(buf).forEach(b => s += String.fromCharCode(b)); return btoa(s); };
const fromB64 = (s) => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const toHex = (u8) => Array.from(u8, b => b.toString(16).padStart(2, '0')).join('');

function normId(s) {
  return String(s ?? '')
    .replace(/[\u0660-\u0669]/g, d => d.charCodeAt(0) - 0x0660)
    .replace(/[\u06F0-\u06F9]/g, d => d.charCodeAt(0) - 0x06F0)
    .replace(/\s+/g, '')
    .toUpperCase();
}

async function deriveFromId(id, salt, iter) {
  const base = await crypto.subtle.importKey('raw', _enc.encode(id), 'PBKDF2', false, ['deriveBits']);
  const bits = new Uint8Array(await crypto.subtle.deriveBits(
    { name: 'PBKDF2', hash: 'SHA-512', salt, iterations: iter }, base, 512));
  return { token: toHex(bits.slice(0, 16)), keyBytes: bits.slice(32, 64) };
}

async function encryptRecord(id, rec, salt, iter) {
  const { token, keyBytes } = await deriveFromId(id, salt, iter);
  const key = await crypto.subtle.importKey('raw', keyBytes, 'AES-GCM', false, ['encrypt']);
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, _enc.encode(JSON.stringify(rec)));
  return [token, { iv: toB64(iv), ct: toB64(ct) }];
}

async function lookupRecord(rawId, data) {
  const id = normId(rawId);
  if (!id) return null;
  const { token, keyBytes } = await deriveFromId(id, fromB64(data.salt), data.iter);
  const r = data.records[token];
  if (!r) return null;
  try {
    const key = await crypto.subtle.importKey('raw', keyBytes, 'AES-GCM', false, ['decrypt']);
    const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: fromB64(r.iv) }, key, fromB64(r.ct));
    return JSON.parse(_dec.decode(pt));
  } catch (e) { return null; }
}


const $ = (id) => document.getElementById(id);
let DATA = null;

async function loadData() {
  if (DATA) return DATA;
  const res = await fetch('data.json', { cache: 'no-cache' });
  if (!res.ok) throw new Error('data');
  DATA = await res.json();
  return DATA;
}

function setStatus(msg, isErr) { const s = $('status'); s.textContent = msg || ''; s.className = 'status' + (isErr ? ' err' : ''); }

function verdictClass(text) {
  if (/راسب|رسب|fail/i.test(text)) return 'fail';
  if (/ناجح|نجح|pass/i.test(text)) return 'pass';
  return '';
}

$('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = $('go');
  $('slip').hidden = true;
  setStatus('جارٍ البحث...');
  btn.disabled = true;
  try {
    const data = await loadData();
    const rec = await lookupRecord($('sid').value, data);
    if (!rec) { setStatus('لا توجد نتيجة لهذا الرقم. تأكد من الرقم الجامعي.', true); return; }
    $('r-name').textContent = rec.n;
    $('r-id').textContent = normId($('sid').value);
    $('r-dept').textContent = rec.d;
    $('r-res').textContent = rec.r;
    $('verdict').className = 'verdict ' + verdictClass(String(rec.r));
    $('slip').hidden = false;
    setStatus('');
  } catch (err) {
    setStatus('تعذر تحميل البيانات. افتح الصفحة من رابط الموقع وليس من الملف مباشرة.', true);
  } finally { btn.disabled = false; }
});
</script>
</body>
</html>
